[package]
name = "saturn-tauri"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "GPL-3.0-or-later"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
gstreamer = "0.25.3"
gstreamer-pbutils = "0.25.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
saturn-core = { path = "../../crates/saturn-core" }
saturn-render = { path = "../../crates/saturn-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["time", "net", "io-util"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
tokio = { version = "1", features = ["macros", "rt"] }
