[package]
name = "saturn-tauri"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "AGPL-3.0-or-later"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
gstreamer = "0.25.3"
gstreamer-pbutils = "0.25.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
saturn-core = { path = "../../crates/saturn-core" }
saturn-render = { path = "../../crates/saturn-render" }
saturn-perception = { path = "../../crates/saturn-perception" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["time", "net", "io-util"] }

# Package the app with a statically linked OpenSSL. Packet 2.2's `ort` pulls
# `ureq`/`native-tls` (model downloads), which on Linux means dynamic
# `libssl.so.3`/`libcrypto.so.3` — those sonames vary across supported distros
# (Debian 12: .so.3; fedora:latest 45: OpenSSL 4, .so.4), which broke the rpm
# install proof in the 0.1.2-alpha.1 packages run (ldd: `libssl.so.3 => not
# found`). Vendored OpenSSL removes the system libssl requirement entirely;
# fedora/Deb proofs re-run on the statically linked binary. App-scoped (not
# perception-wide) so dev/test builds and the CLI stay on the dynamic dep.
[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
tokio = { version = "1", features = ["macros", "rt"] }
