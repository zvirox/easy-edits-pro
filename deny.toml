# cargo-deny configuration: licence gate for the commercial/licensing plan.
# CI runs `cargo deny check licenses` on BOTH workspaces (root and
# apps/saturn-tauri) plus scripts/check-licence-policy.mjs, and fails on
# copyleft-only dependencies (GPL/AGPL-only, non-commercial) and unlicensed
# crates, so a commercial build can never silently inherit duties it cannot
# satisfy.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[licenses]
version = 2
# Scoped policy (AF0, 2026-11-08; docs/audit/af0-inventory.md): permissive +
# weak-copyleft licences compatible with the commercial plan
# (docs/planning/dual-licensing-plan.md §3.3).
# - MPL-2.0 is file-level copyleft: fine statically linked.
# - LGPL appears only as dynamically loaded system libraries (GStreamer),
#   pulled via feature-declared sys crates — the plan's "loaded dynamically
#   from the user's system" carve-out. No Cargo package in either workspace
#   declares an LGPL-only expression (r-efi's OR-tree has MIT/Apache
#   alternatives), so LGPL identifiers are NOT in the allow-list.
# - AGPL/GPL are NOT allowed globally. AGPL-3.0-or-later is the first-party
#   licence and is granted only by the per-crate exceptions below, which
#   cargo-deny matches by crate name; scripts/check-licence-policy.mjs
#   additionally asserts every AGPL-declared package in both graphs has its
#   manifest inside this repository, so a foreign same-named crate cannot
#   inherit the exception.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    # whisper-rs-sys (public-domain Whisper Rust bindings)
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    # jpeg-encoder 0.6: (MIT OR Apache-2.0) AND IJG — the classic permissive libjpeg licence
    "IJG",
    # webpki-root-certs 1.0.11: the bundled root-certificate *data* set
    "CDLA-Permissive-2.0",
]
# First-party crates only (15 workspace members; source headers and manifests
# both AGPL-3.0-or-later since the AF0 metadata correction). The negative
# control in scripts/check-licence-policy.mjs proves a third-party GPL-only
# crate fails this policy while these exceptions keep the workspace green.
exceptions = [
    { name = "saturn-cli", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-commands", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-control", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-core", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-graphics", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-mcp", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-perception", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-plugin-fixture", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-plugin-worker", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-project", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-render", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-tauri", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-text", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-timeline", allow = ["AGPL-3.0-or-later"] },
    { name = "saturn-audio-dsp", allow = ["AGPL-3.0-or-later"] },
]
# Further exceptions must carry version, source, scope and rationale in
# docs/audit/af0-inventory.md and a maintainer decision before landing.

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Unmaintained crates (paste, ttf-parser) are informational warnings, not vulnerabilities.
# We track them but do not fail the build since no maintained alternatives exist yet.
ignore = [
    "RUSTSEC-2024-0436",  # paste: unmaintained
    "RUSTSEC-2026-0192",  # ttf-parser: unmaintained
]
