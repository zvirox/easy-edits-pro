[workspace]
members = [
    "crates/saturn-core",
    "crates/saturn-cli",
    "crates/saturn-render",
    "crates/saturn-commands",
    "crates/saturn-mcp",
    "crates/saturn-control",
    "crates/saturn-timeline",
    "crates/saturn-graphics",
    "crates/saturn-project",
    "crates/saturn-text",
]
resolver = "3"

# Convert integer-overflow corruption into catchable panics in shipped
# builds; dev builds already default to overflow-checks = true.
[profile.release]
overflow-checks = true
