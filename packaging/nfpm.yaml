name: easy-edits-pro
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: video
maintainer: Prakash <zvirox@proton.me>
description: Open source video editor for Linux built with Rust, Tauri, and GStreamer
homepage: https://github.com/zvirox/easy-edits-pro
license: AGPL-3.0-or-later

contents:
  - src: target/release/easy-edits-pro
    dst: /usr/bin/easy-edits-pro
    file_info: { mode: 0755 }
  - src: target/release/saturn-plugin-worker
    dst: /usr/bin/saturn-plugin-worker
    file_info: { mode: 0755 }
  - src: packaging/easy-edits-pro.desktop
    dst: /usr/share/applications/easy-edits-pro.desktop
  - src: packaging/icons/hicolor/32x32/apps/easy-edits-pro.png
    dst: /usr/share/icons/hicolor/32x32/apps/easy-edits-pro.png
  - src: packaging/icons/hicolor/64x64/apps/easy-edits-pro.png
    dst: /usr/share/icons/hicolor/64x64/apps/easy-edits-pro.png
  - src: packaging/icons/hicolor/128x128/apps/easy-edits-pro.png
    dst: /usr/share/icons/hicolor/128x128/apps/easy-edits-pro.png
  - src: packaging/icons/hicolor/256x256/apps/easy-edits-pro.png
    dst: /usr/share/icons/hicolor/256x256/apps/easy-edits-pro.png
  - src: packaging/icons/hicolor/512x512/apps/easy-edits-pro.png
    dst: /usr/share/icons/hicolor/512x512/apps/easy-edits-pro.png
  - src: LICENSE
    dst: /usr/share/doc/easy-edits-pro/LICENSE
    packager: deb
  - src: LICENSE
    dst: /usr/share/doc/easy-edits-pro/LICENSE
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/easy-edits-pro/LICENSE
    packager: archlinux

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh

overrides:
  deb:
    depends:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libges-1.0-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gst-editing-services
  archlinux:
    depends:
      - webkit2gtk-4.1
      - gtk3
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad
      - gst-plugins-ugly
      - gst-editing-services
