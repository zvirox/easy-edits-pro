name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch supersedes in-flight runs so stacked pushes
# do not queue three full CI executions on top of each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Licence gate for the dual-licensing plan
      # (docs/planning/dual-licensing-plan.md §3.3): fails on copyleft-only,
      # non-commercial or unlicensed dependencies across all target triples.
      - name: Check dependency licences (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      # Every first-party source file must carry the AGPL SPDX header
      # (docs/planning/dual-licensing-plan.md §5, §7).
      - name: Check SPDX licence headers
        run: node scripts/license-headers.mjs check

  python-cli-harness:
    runs-on: ubuntu-24.04
    # 15 minutes proved too tight when the apt mirror crawls: libges-1.0-dev
    # pulls a large transitive tree, and a bad mirror moment ate the whole
    # budget before pytest even started (run 39925748952). The watchdog still
    # catches real test hangs; this only adds apt headroom.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libges-1.0-dev

      - name: Install CLI harness in editable mode
        run: python -m pip install --editable ./agent-harness

      - name: Install Python test runner
        run: python -m pip install pytest

      - name: Build Rust backends
        run: cargo build --locked --bin saturn-cli --bin saturn-mcp --bin saturn-control

      - name: Verify CLI harness and Rust integration
        run: python -m pytest -q agent-harness/tests

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libges-1.0-dev \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Core & Render tests
        run: |
          # The plugin host tests load real artifacts on disk: the fixture
          # cdylib (org.eep.fixture.gain) and the sandbox worker binary.
          # `cargo test` does not link unrelated cdylib/bin targets, so build
          # the two before the suite; `cargo build` inside the test would
          # otherwise race the suite from nested processes.
          cargo build --locked -p saturn-plugin-fixture -p saturn-plugin-worker
          cargo test --workspace --verbose

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/saturn-tauri/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/saturn-tauri
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build UI
        working-directory: apps/saturn-tauri
        run: pnpm build

      - name: Run UI unit tests
        working-directory: apps/saturn-tauri
        run: pnpm test

      - name: Check contrast and text-colour tokens
        working-directory: apps/saturn-tauri
        run: pnpm check:contrast

      - name: Check style gates and raw-colour ratchet
        working-directory: apps/saturn-tauri
        run: pnpm check:styles

      - name: Check generated token documentation
        working-directory: apps/saturn-tauri
        run: pnpm check:tokens

      - name: Check source file size limits (800 lines)
        working-directory: apps/saturn-tauri
        run: pnpm check:source-size --max-lines=800

      - name: Check command catalogue structure
        working-directory: apps/saturn-tauri
        run: pnpm check:commands

      - name: Check command catalogue drift
        working-directory: apps/saturn-tauri
        run: pnpm catalogue:check

      - name: Check parity report drift
        working-directory: apps/saturn-tauri
        run: pnpm check:parity --check

      - name: Check Tauri desktop backend
        working-directory: apps/saturn-tauri
        run: cargo check --verbose

      - name: Run Tauri crate tests
        working-directory: apps/saturn-tauri
        run: cargo test --verbose

      - name: Install Playwright Chromium
        working-directory: apps/saturn-tauri
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke test
        working-directory: apps/saturn-tauri
        run: pnpm test:e2e
