name: Linux Packages & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/saturn-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/saturn-tauri -> target

      - name: Install desktop and media build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev pkg-config rpm libfuse2 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libges-1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Install frontend dependencies
        working-directory: apps/saturn-tauri
        run: pnpm install --frozen-lockfile

      - name: Build AppImage, Debian and RPM packages
        working-directory: apps/saturn-tauri
        run: pnpm tauri build

      - name: Generate Checksums
        working-directory: apps/saturn-tauri/target/release/bundle
        run: |
          sha256sum appimage/*.AppImage deb/*.deb rpm/*.rpm > SHA256SUMS || true

      - uses: actions/upload-artifact@v4
        with:
          name: easy-edits-pro-linux-packages
          path: |
            apps/saturn-tauri/target/release/bundle/appimage/*.AppImage
            apps/saturn-tauri/target/release/bundle/deb/*.deb
            apps/saturn-tauri/target/release/bundle/rpm/*.rpm
            apps/saturn-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            apps/saturn-tauri/target/release/bundle/appimage/*.AppImage
            apps/saturn-tauri/target/release/bundle/deb/*.deb
            apps/saturn-tauri/target/release/bundle/rpm/*.rpm
            apps/saturn-tauri/target/release/bundle/SHA256SUMS
