name: Linux Packages & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/saturn-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/saturn-tauri -> target

      - name: Install desktop and media build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev pkg-config rpm \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libges-1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Install frontend dependencies
        working-directory: apps/saturn-tauri
        run: pnpm install --frozen-lockfile

      - name: Set package version from alpha tag
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-alpha.')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Expected an alpha tag like v0.1.0-alpha.1; got $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          jq --arg version "$version" '.version = $version' \
            apps/saturn-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/saturn-tauri/tauri.conf.json

      - name: Build Debian and RPM packages
        working-directory: apps/saturn-tauri
        run: pnpm tauri build

      - name: Generate Checksums
        working-directory: apps/saturn-tauri/target/release/bundle
        run: |
          sha256sum deb/*.deb rpm/*.rpm > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: easy-edits-pro-linux-packages
          path: |
            apps/saturn-tauri/target/release/bundle/deb/*.deb
            apps/saturn-tauri/target/release/bundle/rpm/*.rpm
            apps/saturn-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-alpha.')
        uses: softprops/action-gh-release@v2
        with:
          name: Easy Edits Pro ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            apps/saturn-tauri/target/release/bundle/deb/*.deb
            apps/saturn-tauri/target/release/bundle/rpm/*.rpm
            apps/saturn-tauri/target/release/bundle/SHA256SUMS

  install-proof-deb:
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: easy-edits-pro-linux-packages
          path: pkg

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils

      - name: Real dpkg install + edit-to-render proof (debian:12, headless)
        run: |
          python3 tests/native/installed_package_workflow.py \
            --deb "$(find pkg -name '*.deb' | head -1)" --container

      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-proof-deb-evidence
          path: |
            /tmp/eep-pkg-*/
          if-no-files-found: ignore

  install-proof-rpm:
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: easy-edits-pro-linux-packages
          path: pkg

      - name: Real dnf install + edit-to-render proof (fedora:latest, WebM/VP8)
        run: |
          python3 tests/native/installed_package_workflow.py \
            --rpm "$(find pkg -name '*.rpm' | head -1)" --rpm-container

      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-proof-rpm-evidence
          path: |
            /tmp/eep-pkg-*/
          if-no-files-found: ignore

  install-proof-flatpak:
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: easy-edits-pro-linux-packages
          path: pkg

      - name: Install host-side drive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak xvfb ffmpeg dbus dbus-x11

      - name: Session runtime dir (the runner uid is 1001, not the manifest's /run/user/1000)
        run: |
          RD=/run/user/$(id -u)
          sudo mkdir -p "$RD"
          sudo chown "$(id -u):$(id -g)" "$RD"
          sudo chmod 700 "$RD"
          echo "RD=$RD" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RD" >> "$GITHUB_ENV"

      - name: Install Builder + the GNOME 49 runtime + SDK (flathub)
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          # apt's flatpak-builder (1.2.x, jammy) lacks the appstream-compose
          # CLI its export step calls; the flathub Builder bundles a current
          # toolchain and is the same route the E.5 spike used locally.
          flatpak install -y --user flathub org.flatpak.Builder
          flatpak install -y --user flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Prepare the payload from the built .deb
        run: DEB="$(find pkg -name '*.deb' | head -1)" bash packaging/flatpak/make-payload.sh

      - name: flatpak-builder build (compiles GES 1.26.11 in the sandbox)
        run: |
          flatpak run org.flatpak.Builder --install-deps-from=flathub --force-clean \
            --repo=flatpak-ci-repo \
            packaging/flatpak/build packaging/flatpak/io.github.zvirox.EasyEditsPro.yml

      - name: Install locally + export a bundle artifact
        run: |
          flatpak install -y --user flatpak-ci-repo io.github.zvirox.EasyEditsPro
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-ci-repo easy-edits-pro-linux-x86_64.flatpak io.github.zvirox.EasyEditsPro
          sha256sum easy-edits-pro-linux-x86_64.flatpak \
            > easy-edits-pro-linux-x86_64.flatpak.sha256
          ls -la easy-edits-pro-linux-x86_64.flatpak

      - name: Attach the bundle + checksum to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            easy-edits-pro-linux-x86_64.flatpak \
            easy-edits-pro-linux-x86_64.flatpak.sha256

      - name: Acceptance drive (MCP edit-to-render inside the sandbox)
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          dbus-run-session -- bash -c \
            'export DISPLAY=:99 XDG_RUNTIME_DIR="$RD"; \
             python3 tests/native/installed_package_workflow.py --flatpak \
               --flatpak-env LIBGL_ALWAYS_SOFTWARE=1 \
               --flatpak-env WEBKIT_DISABLE_DMABUF_RENDERER=1 \
               --flatpak-file "$RD"'

      - name: Upload the flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: easy-edits-pro-flatpak-bundle
          path: |
            easy-edits-pro-linux-x86_64.flatpak
            easy-edits-pro-linux-x86_64.flatpak.sha256
          if-no-files-found: ignore

      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-proof-flatpak-evidence
          path: |
            /tmp/eep-pkg-*/
          if-no-files-found: ignore
