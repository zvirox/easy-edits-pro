name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libges-1.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Core & Render tests
        run: cargo test --workspace --verbose

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/saturn-tauri/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/saturn-tauri
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build UI
        working-directory: apps/saturn-tauri
        run: pnpm build

      - name: Run UI unit tests
        working-directory: apps/saturn-tauri
        run: pnpm test

      - name: Check source file size limits (800 lines)
        working-directory: apps/saturn-tauri
        run: pnpm check:source-size --max-lines 800

      - name: Check Tauri desktop backend
        working-directory: apps/saturn-tauri
        run: cargo check --verbose

      - name: Run Tauri crate tests
        working-directory: apps/saturn-tauri
        run: cargo test --verbose

      - name: Run Playwright smoke test
        working-directory: apps/saturn-tauri
        run: pnpm test:e2e
