[package]
name = "saturn-commands"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Unified command system for Easy Edits Pro"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
log = "0.4"
regex = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }