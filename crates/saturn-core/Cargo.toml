[package]
name = "saturn-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Framework-independent project, timeline, and command engine for Project Saturn"

[dependencies]
blake3 = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
saturn-text = { path = "../saturn-text" }

[dev-dependencies]
tempfile = "3"
