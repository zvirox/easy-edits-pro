[package]
name = "saturn-graphics"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Graphics templates (.fcgt-like format) for Easy Edits Pro"

[dependencies]
saturn-commands = { path = "../saturn-commands" }
saturn-core = { path = "../saturn-core" }
saturn-timeline = { path = "../saturn-timeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = "2"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }