[package]
name = "saturn-control"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Control server for external automation in Easy Edits Pro"

[dependencies]
saturn-commands = { path = "../saturn-commands" }
saturn-core = { path = "../saturn-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["ws", "json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
parking_lot = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"