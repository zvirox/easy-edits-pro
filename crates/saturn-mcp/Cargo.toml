[package]
name = "saturn-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "MCP server for AI-assisted editing in Easy Edits Pro"

[dependencies]
saturn-core = { path = "../saturn-core" }
saturn-render = { path = "../saturn-render" }
saturn-perception = { path = "../saturn-perception" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "1.4", default-features = false, features = ["server", "transport-io", "macros", "base64"] }
anyhow = "1"
