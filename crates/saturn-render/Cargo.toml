[package]
name = "saturn-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
description = "Native timeline rendering for Project Saturn using GStreamer Editing Services"

[dependencies]
gstreamer = "0.25.3"
gstreamer-editing-services = { version = "0.25.4", features = ["v1_18"] }
gstreamer-pbutils = "0.25.3"
saturn-core = { path = "../saturn-core" }
saturn-text = { path = "../saturn-text" }
# Packet 2.2: the semantic-query and cut-continuity tool payloads embed
# frames locally (saturn-perception). Perception stays render-free: it never
# depends back on this crate; the decode closures live with the callers.
saturn-perception = { path = "../saturn-perception" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer-video = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-base = "0.25.3"
png = "0.17"
jpeg-encoder = "0.6"
base64 = "0.22"
wgpu = "30.0.1"
thiserror = "2"
pollster = "0.4"

[dev-dependencies]
tempfile = "3"
